site_name: MobsManager
site_description: Documentation for MobsManager, a Bukkit, Spigot, and Paper plugin for managing mob spawning per world.
site_url: https://stellionix.github.io/MobsManager/
repo_name: stellionix/MobsManager
repo_url: https://github.com/stellionix/MobsManager
edit_uri: edit/master/docs/

plugins:
  - search

theme:
  name: material
  language: en
  logo: assets/mobsmanager-logo.png
  favicon: assets/mobsmanager-logo.png
  features:
    - navigation.sections
    - navigation.top
    - navigation.instant
    - navigation.tracking
    - content.code.copy
    - search.suggest
    - search.highlight
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: teal
      accent: amber
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: cyan
      accent: amber
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables

extra:
  version:
    provider: mike
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/stellionix/MobsManager
    - icon: fontawesome/brands/discord
      link: https://discord.com/invite/jCsvJxS

extra_css:
  - stylesheets/extra.css

copyright: Copyright © MobsManager

docs_dir: docs
site_dir: site
use_directory_urls: true

nav:
  - Getting Started:
      - Home: index.md
      - Download: download.md
      - Installation: installation.md
      - How It Works: how-it-works.md
  - Administration:
      - Configuration: configuration.md
      - Commands and Permissions: commands-and-perms.md
      - Troubleshooting: troubleshooting.md
  - Developer:
      - Contributing: contribution.md
